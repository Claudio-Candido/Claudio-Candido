<svg xmlns="http://www.w3.org/2000/svg" width="420" height="44" viewBox="0 0 420 44" role="img" aria-label="Social links">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="420" height="44" rx="10" fill="#0f172a"/>
  <text x="18" y="28" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Connect</text>
  <circle cx="100" cy="22" r="3" fill="url(#g)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="112" y="28" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">LinkedIn · GitHub · Luanda</text>
</svg>
